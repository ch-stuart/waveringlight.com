<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="32"
  height="32"
  viewBox="0 0 32 32"
  shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816" />
      <stop offset="1" stop-color="#0f1a3d" />
    </linearGradient>
    <style>
      .px { width: 1px; height: 1px; }
      .s1 { fill: #b4dcff; opacity: 0.25; animation: tw1 1.8s steps(1, end) infinite; }
      .s2 { fill: #fff2c9; opacity: 0.18; animation: tw2 2.1s steps(1, end) infinite; }
      .s3 { fill: #4fd3d6; opacity: 0.14; animation: tw3 2.6s steps(1, end) infinite; }
      .scan { fill: rgba(255,255,255,0.05); }

      @keyframes tw1 {
        0%, 12% { opacity: 0.10; }
        13%, 20% { opacity: 0.85; }
        21%, 55% { opacity: 0.20; }
        56%, 62% { opacity: 0.70; }
        63%, 100% { opacity: 0.12; }
      }
      @keyframes tw2 {
        0%, 18% { opacity: 0.08; }
        19%, 26% { opacity: 0.78; }
        27%, 60% { opacity: 0.16; }
        61%, 68% { opacity: 0.62; }
        69%, 100% { opacity: 0.10; }
      }
      @keyframes tw3 {
        0%, 22% { opacity: 0.06; }
        23%, 30% { opacity: 0.62; }
        31%, 66% { opacity: 0.12; }
        67%, 74% { opacity: 0.52; }
        75%, 100% { opacity: 0.08; }
      }

      @media (prefers-reduced-motion: reduce) {
        .s1, .s2, .s3 { animation: none; opacity: 0.22; }
      }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="32" height="32" fill="url(#bg)" />

  <!-- scanlines -->
  <g opacity="0.35">
    <rect class="scan" x="0" y="0" width="32" height="1" />
    <rect class="scan" x="0" y="2" width="32" height="1" />
    <rect class="scan" x="0" y="4" width="32" height="1" />
    <rect class="scan" x="0" y="6" width="32" height="1" />
    <rect class="scan" x="0" y="8" width="32" height="1" />
    <rect class="scan" x="0" y="10" width="32" height="1" />
    <rect class="scan" x="0" y="12" width="32" height="1" />
    <rect class="scan" x="0" y="14" width="32" height="1" />
    <rect class="scan" x="0" y="16" width="32" height="1" />
    <rect class="scan" x="0" y="18" width="32" height="1" />
    <rect class="scan" x="0" y="20" width="32" height="1" />
    <rect class="scan" x="0" y="22" width="32" height="1" />
    <rect class="scan" x="0" y="24" width="32" height="1" />
    <rect class="scan" x="0" y="26" width="32" height="1" />
    <rect class="scan" x="0" y="28" width="32" height="1" />
    <rect class="scan" x="0" y="30" width="32" height="1" />
  </g>

  <!-- pixel "glyphs" (dots/colons/pluses/stars) -->
  <!-- stars -->
  <g class="s2">
    <rect class="px" x="8" y="9" width="1" height="1" />
    <rect class="px" x="7" y="9" width="1" height="1" />
    <rect class="px" x="9" y="9" width="1" height="1" />
    <rect class="px" x="8" y="8" width="1" height="1" />
    <rect class="px" x="8" y="10" width="1" height="1" />

    <rect class="px" x="23" y="14" width="1" height="1" />
    <rect class="px" x="22" y="14" width="1" height="1" />
    <rect class="px" x="24" y="14" width="1" height="1" />
    <rect class="px" x="23" y="13" width="1" height="1" />
    <rect class="px" x="23" y="15" width="1" height="1" />

    <rect class="px" x="14" y="22" width="1" height="1" />
    <rect class="px" x="13" y="22" width="1" height="1" />
    <rect class="px" x="15" y="22" width="1" height="1" />
    <rect class="px" x="14" y="21" width="1" height="1" />
    <rect class="px" x="14" y="23" width="1" height="1" />
  </g>

  <!-- pluses -->
  <g class="s1" style="animation-delay: -0.6s">
    <rect class="px" x="18" y="7" width="1" height="1" />
    <rect class="px" x="19" y="7" width="1" height="1" />
    <rect class="px" x="18" y="8" width="1" height="1" />

    <rect class="px" x="6" y="19" width="1" height="1" />
    <rect class="px" x="7" y="19" width="1" height="1" />
    <rect class="px" x="6" y="20" width="1" height="1" />
  </g>

  <!-- colons -->
  <g class="s3" style="animation-delay: -1.1s">
    <rect class="px" x="11" y="6" width="1" height="1" />
    <rect class="px" x="11" y="7" width="1" height="1" />

    <rect class="px" x="26" y="10" width="1" height="1" />
    <rect class="px" x="26" y="11" width="1" height="1" />

    <rect class="px" x="20" y="24" width="1" height="1" />
    <rect class="px" x="20" y="25" width="1" height="1" />
  </g>

  <!-- dots / drift -->
  <g class="s1" style="animation-delay: -0.2s">
    <rect class="px" x="4" y="6" width="1" height="1" />
    <rect class="px" x="28" y="6" width="1" height="1" />
    <rect class="px" x="5" y="12" width="1" height="1" />
    <rect class="px" x="12" y="12" width="1" height="1" />
    <rect class="px" x="29" y="12" width="1" height="1" />
    <rect class="px" x="9" y="16" width="1" height="1" />
    <rect class="px" x="16" y="16" width="1" height="1" />
    <rect class="px" x="25" y="18" width="1" height="1" />
    <rect class="px" x="3" y="24" width="1" height="1" />
    <rect class="px" x="27" y="24" width="1" height="1" />
  </g>

  <g class="s2" style="animation-delay: -0.9s">
    <rect class="px" x="6" y="8" width="1" height="1" />
    <rect class="px" x="15" y="10" width="1" height="1" />
    <rect class="px" x="21" y="11" width="1" height="1" />
    <rect class="px" x="10" y="18" width="1" height="1" />
    <rect class="px" x="19" y="19" width="1" height="1" />
    <rect class="px" x="24" y="22" width="1" height="1" />
    <rect class="px" x="8" y="26" width="1" height="1" />
    <rect class="px" x="17" y="26" width="1" height="1" />
  </g>

  <g class="s3" style="animation-delay: -1.6s">
    <rect class="px" x="13" y="4" width="1" height="1" />
    <rect class="px" x="22" y="5" width="1" height="1" />
    <rect class="px" x="2" y="14" width="1" height="1" />
    <rect class="px" x="30" y="16" width="1" height="1" />
    <rect class="px" x="12" y="28" width="1" height="1" />
    <rect class="px" x="24" y="28" width="1" height="1" />
  </g>
</svg>
